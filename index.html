<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Flag Cup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700;800&display=swap">
<style>
  /* ── The Flag Cup — single committed theme: bright matchday ───────── */
  :root{
    --pitch:#2EA35B; --pitch2:#279255;
    --ink:#202A5C; --ink-soft:#4A548C;
    --card:#FFFFFF; --card-dim:#F2F5FF;
    --sun:#FFC626; --sun-deep:#D89E00;
    --good:#05A357; --good-soft:#DFF7EA;
    --oops:#FF6B6B; --oops-soft:#FFE9E9;
    --sky:#8ED4FF;
    --shadow:0 6px 0 rgba(18,58,35,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0; min-height:100%;
    background:repeating-linear-gradient(90deg, var(--pitch) 0 90px, var(--pitch2) 90px 180px);
    font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
    color:var(--ink);
    touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center;
  }
  #stage{width:100%; max-width:640px; padding:14px 14px 40px; margin:0 auto}
  button{font-family:inherit; cursor:pointer}
  button:focus-visible, a:focus-visible{outline:4px solid var(--sun); outline-offset:2px}

  /* sticker headline */
  .biglogo{
    font-family:"Lilita One","Baloo 2",sans-serif;
    text-align:center; color:#fff; margin:14px 0 4px;
    font-size:clamp(38px,9vw,58px); line-height:1; letter-spacing:1px;
    text-shadow:
      3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink),
      3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
      0 9px 0 rgba(18,58,35,.30);
    text-wrap:balance;
  }
  .biglogo .sun{color:var(--sun)}
  .tagline{text-align:center; color:#EAFFF2; font-weight:700; margin:0 0 18px; font-size:17px;
    text-shadow:0 2px 0 rgba(18,58,35,.35)}

  .card{
    background:var(--card); color:var(--ink);
    border:4px solid var(--ink); border-radius:22px;
    box-shadow:var(--shadow);
    padding:16px;
  }

  /* mode menu */
  .modes{display:grid; gap:14px; margin-top:6px}
  .mode-btn{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--card); border:4px solid var(--ink); border-radius:22px;
    box-shadow:var(--shadow); padding:14px 16px; width:100%;
    transition:transform .08s ease;
  }
  .mode-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(18,58,35,.28)}
  .mode-ico{font-size:40px; width:58px; height:58px; display:grid; place-items:center;
    background:var(--card-dim); border:3px solid var(--ink); border-radius:16px; flex:none}
  .mode-name{font-family:"Lilita One",sans-serif; font-size:24px; letter-spacing:.5px}
  .mode-sub{font-weight:700; color:var(--ink-soft); font-size:15px; margin-top:2px}
  .mode-stars{margin-left:auto; font-weight:800; color:var(--sun-deep); font-size:15px; white-space:nowrap}

  .totals{display:flex; justify-content:center; gap:10px; margin:16px 0 2px; flex-wrap:wrap}
  .pill{background:var(--card); border:3px solid var(--ink); border-radius:999px;
    box-shadow:0 4px 0 rgba(18,58,35,.25);
    padding:6px 14px; font-weight:800; font-size:15px; display:flex; align-items:center; gap:6px}
  .pill button{border:0; background:none; font:inherit; font-weight:800; padding:0; color:var(--ink)}

  /* level select */
  .topbar{display:flex; align-items:center; gap:10px; margin:6px 0 14px}
  .back-btn{width:52px; height:52px; flex:none; border-radius:16px; border:4px solid var(--ink);
    background:var(--card); box-shadow:0 4px 0 rgba(18,58,35,.25); font-size:22px; font-weight:800; color:var(--ink)}
  .screen-title{font-family:"Lilita One",sans-serif; color:#fff; font-size:clamp(26px,6vw,34px);
    text-shadow:2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 6px 0 rgba(18,58,35,.3);
    margin:0; line-height:1.05}
  .levels{display:grid; gap:14px}
  .level-btn{display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    background:var(--card); border:4px solid var(--ink); border-radius:22px; box-shadow:var(--shadow);
    padding:12px 16px; transition:transform .08s ease}
  .level-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(18,58,35,.28)}
  .level-num{font-family:"Lilita One",sans-serif; font-size:26px; width:54px; height:54px; flex:none;
    display:grid; place-items:center; background:var(--sun); border:3px solid var(--ink); border-radius:50%;}
  .level-name{font-family:"Lilita One",sans-serif; font-size:22px}
  .level-flags{display:flex; gap:4px; margin-top:5px}
  .level-flags .mini{width:34px; border:2px solid var(--ink); border-radius:5px; overflow:hidden; line-height:0; background:#fff}
  .level-flags .mini.sq{border-color:transparent; background:transparent}
  .level-stars{margin-left:auto; flex:none}

  /* quiz */
  .quizbar{display:flex; align-items:center; gap:10px; margin:6px 0 12px}
  .dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; flex:1}
  .dot{width:17px; height:17px; border-radius:50%; border:3px solid var(--ink); background:var(--card)}
  .dot.now{background:var(--sky)}
  .dot.hit{background:var(--good)}
  .dot.ok{background:var(--sun)}
  .ballcount{font-weight:800; font-size:17px; background:var(--card); border:3px solid var(--ink);
    border-radius:999px; padding:4px 12px; box-shadow:0 4px 0 rgba(18,58,35,.25); white-space:nowrap}

  .qcard{background:var(--card); border:4px solid var(--ink); border-radius:24px; box-shadow:var(--shadow);
    padding:18px; text-align:center; margin-bottom:14px; position:relative}
  .qprompt{font-weight:800; font-size:clamp(19px,4.6vw,23px); margin:0 0 12px; padding:0 46px; text-wrap:balance}
  .bigflag{width:min(78%,320px); margin:2px auto 6px; border:4px solid var(--ink); border-radius:14px;
    overflow:hidden; line-height:0; background:#fff; box-shadow:0 5px 0 rgba(18,58,35,.18)}
  .bigflag.sq{background:transparent; border-color:transparent; box-shadow:none}
  .say-btn{position:absolute; top:10px; right:10px; width:52px; height:52px; border-radius:50%;
    border:4px solid var(--ink); background:var(--sun); font-size:23px; box-shadow:0 4px 0 rgba(18,58,35,.25)}
  .say-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(18,58,35,.25)}

  .answers{display:grid; gap:12px}
  .answers.flagrid{grid-template-columns:1fr 1fr}
  .ans-btn{
    background:var(--card); border:4px solid var(--ink); border-radius:20px; box-shadow:var(--shadow);
    padding:14px 16px; font-size:clamp(19px,5vw,24px); font-weight:800; color:var(--ink);
    min-height:64px; transition:transform .08s ease; display:flex; align-items:center; justify-content:center; gap:12px;
  }
  .ans-btn .optflag{width:52px; flex:none; border:2px solid var(--ink); border-radius:6px; overflow:hidden; line-height:0; background:#fff}
  .ans-btn .optflag.sq{border-color:transparent; background:transparent}
  .ans-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(18,58,35,.28)}
  .ans-btn.flagopt{padding:10px}
  .ans-btn.flagopt .optflag{width:100%; border-width:3px; border-radius:10px}
  .ans-btn.right{background:var(--good-soft); border-color:var(--good)}
  .ans-btn.nope{background:var(--oops-soft); opacity:.65; animation:wobble .45s ease}
  .ans-btn:disabled{cursor:default}
  @keyframes wobble{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
    40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)}
  }

  .feedback{margin-top:14px; border-radius:18px; border:4px solid var(--ink); padding:12px 14px;
    font-weight:800; font-size:18px; text-align:center; text-wrap:balance}
  .feedback.yay{background:var(--good-soft); border-color:var(--good); color:#03592F}
  .feedback.try{background:var(--oops-soft); border-color:var(--oops); color:#8C2B2B}
  .feedback .fact{display:block; font-weight:700; font-size:15.5px; margin-top:4px; color:var(--ink-soft)}

  /* results */
  .results{ text-align:center; padding:26px 18px }
  .results h2{font-family:"Lilita One",sans-serif; font-size:clamp(30px,8vw,42px); margin:4px 0 8px}
  .starrow{display:flex; justify-content:center; gap:8px; margin:10px 0}
  .starrow svg{width:64px; height:64px}
  .starrow .pop{animation:starpop .5s ease both}
  @keyframes starpop{0%{transform:scale(0) rotate(-30deg)} 70%{transform:scale(1.25)} 100%{transform:scale(1)}}
  .results .scoreline{font-weight:800; font-size:20px; margin:6px 0 16px}
  .results .cheer{font-weight:700; color:var(--ink-soft); margin:0 0 18px; font-size:17px}
  .btnrow{display:grid; gap:12px}
  .go-btn{background:var(--sun); border:4px solid var(--ink); border-radius:20px; box-shadow:var(--shadow);
    font-family:"Lilita One",sans-serif; font-size:23px; letter-spacing:.5px; color:var(--ink);
    padding:14px; min-height:60px; transition:transform .08s ease}
  .go-btn.quiet{background:var(--card); font-family:"Baloo 2",sans-serif; font-weight:800; font-size:19px}
  .go-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(18,58,35,.28)}

  /* flag book */
  .bookgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin-top:12px}
  .sticker{background:var(--card); border:4px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 rgba(18,58,35,.25);
    padding:9px; text-align:center; transition:transform .08s ease; position:relative}
  .sticker:active{transform:translateY(3px)}
  .sticker .flg{border:2px solid var(--ink); border-radius:8px; overflow:hidden; line-height:0; background:#fff}
  .sticker .flg.sq{border-color:transparent; background:transparent}
  .sticker .nm{font-weight:800; font-size:14.5px; margin-top:7px; line-height:1.15}
  .sticker .medal{position:absolute; top:-10px; right:-8px; font-size:21px; filter:drop-shadow(0 2px 0 rgba(18,58,35,.3))}
  .booksec{font-family:"Lilita One",sans-serif; color:#fff; font-size:23px; margin:20px 0 2px;
    text-shadow:2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink)}

  /* sticker detail */
  .peek{position:fixed; inset:0; background:rgba(18,42,30,.55); display:grid; place-items:center; padding:20px; z-index:40}
  .peek .card{max-width:380px; width:100%; text-align:center; padding:20px}
  .peek .bigflag{width:min(84%,300px)}
  .peek h3{font-family:"Lilita One",sans-serif; font-size:30px; margin:10px 0 4px}
  .peek .fact{font-weight:700; color:var(--ink-soft); font-size:16.5px; margin:0 0 14px}
  .peek .learn{font-weight:800; color:var(--sun-deep); font-size:15px; margin:0 0 14px}

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:60}
  .hidden{display:none}

  .mode-btn.daily{background:linear-gradient(135deg,#FFF6D6,#FFE9A8)}
  .turnbanner{background:var(--sky); border:3px solid var(--ink); border-radius:14px;
    font-weight:800; font-size:17px; padding:6px 10px; margin:-4px 0 10px; display:inline-block}
  .timerbar{height:18px; border:3px solid var(--ink); border-radius:999px; background:var(--card);
    overflow:hidden; margin:10px 0 14px}
  .timerbar > div{height:100%; background:var(--sun); transition:width .1s linear}
  .trophyrow{display:flex; align-items:center; gap:12px; background:var(--card); border:4px solid var(--ink);
    border-radius:20px; box-shadow:var(--shadow); padding:12px 16px}
  .trophyrow .tname{font-family:"Lilita One",sans-serif; font-size:20px}
  .trophyrow .tstars{margin-left:auto; font-weight:800; color:var(--sun-deep)}
  .certcard{background:#FFFDF4; border:6px double var(--sun-deep); border-radius:14px; padding:26px 20px;
    text-align:center; color:var(--ink)}
  .certcard h2{font-family:"Lilita One",sans-serif; font-size:30px; margin:6px 0}
  .certcard .cname{font-family:"Lilita One",sans-serif; font-size:38px; color:var(--sun-deep); margin:10px 0}
  .certcard p{font-weight:700; margin:6px 0}

  #printzone{display:none}
  @media print{
    #printzone{display:block; color:#000}
    body.printing > :not(#printzone){display:none !important}
    #printzone h1{font-family:"Lilita One",sans-serif; text-align:center; margin:0 0 8px}
    #printzone h2{font-family:"Lilita One",sans-serif; font-size:14px; margin:10px 0 4px}
    .printgrid{display:grid; grid-template-columns:repeat(8,1fr); gap:4px}
    .pf .pfl{border:1px solid #000; line-height:0}
    .pf .pfn{font:7px sans-serif; text-align:center}
    .certcard{border:6px double #B8860B; page-break-inside:avoid}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
  @media (max-width:420px){
    .answers.flagrid{grid-template-columns:1fr 1fr}
    .mode-ico{width:50px;height:50px;font-size:34px}
  }
</style>

<div id="stage" aria-live="polite"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════════
   THE FLAG CUP — flags + World Cup trivia for a 6½-year-old.
   Self-contained: SVG flags are generated below, sounds via WebAudio,
   reading aloud via speechSynthesis, progress in localStorage.
   ════════════════════════════════════════════════════════════════════════ */
const PLAYER = 'Champ';
const PLAYER2 = '';        // pre-loaded second player ('' = none)

/* ── SVG flag builders (300×200 viewBox) ─────────────────────────────── */
const W = 300, H = 200;
let svgUid = 0;   // unique ids per rendered copy, so defs (clipPaths) never collide
const wrap = inner => `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${inner.split('__UID__').join(++svgUid)}</svg>`;
const rect = (x,y,w,h,fill) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;

function hs(colors, weights){                       // horizontal stripes
  weights = weights || colors.map(()=>1);
  const total = weights.reduce((a,b)=>a+b,0);
  let y = 0, s = '';
  colors.forEach((c,i)=>{ const h = H*weights[i]/total; s += rect(0,y,W,h+0.5,c); y += h; });
  return s;
}
function vs(colors, weights){                       // vertical stripes
  weights = weights || colors.map(()=>1);
  const total = weights.reduce((a,b)=>a+b,0);
  let x = 0, s = '';
  colors.forEach((c,i)=>{ const w = W*weights[i]/total; s += rect(x,0,w+0.5,H,c); x += w; });
  return s;
}
function nordic(bg, cross, inner){                  // Nordic cross, hoist-shifted
  let s = rect(0,0,W,H,bg);
  s += rect(90,0,44,H,cross) + rect(0,78,W,44,cross);
  if(inner){ s += rect(101,0,22,H,inner) + rect(0,89,W,22,inner); }
  return s;
}
function starPts(cx, cy, r, rot=-90, points=5, innerRatio=0.382){
  const pts = [];
  for(let i=0;i<points*2;i++){
    const rr = i%2===0 ? r : r*innerRatio;
    const a = (Math.PI/points)*i + rot*Math.PI/180;
    pts.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}
const star = (cx,cy,r,fill,rot=-90,pts=5) =>
  `<polygon points="${starPts(cx,cy,r,rot,pts, pts===5?0.382:0.5)}" fill="${fill}"/>`;

function sunOfMay(cx, cy, r, color, rays=32){       // Sol de Mayo: straight + wavy rays alternate
  let s = '';
  const pol = (a,rr)=> (cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1);
  const hw = 2.24/rays;                             // base half-width scales with ray count
  for(let i=0;i<rays;i++){
    const a = i*2*Math.PI/rays;
    if(i%2===0){
      s += `<polygon points="${pol(a+hw,r*0.92)} ${pol(a,r*2.1)} ${pol(a-hw,r*0.92)}" fill="${color}"/>`;
    } else {                                        // wavy ray, all curling the same way
      s += `<path d="M ${pol(a+hw*0.9,r*0.92)} Q ${pol(a+hw*3.2,r*1.45)} ${pol(a+hw*1.6,r*1.9)} Q ${pol(a-hw*0.6,r*1.35)} ${pol(a-hw*0.9,r*0.92)} Z" fill="${color}"/>`;
    }
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
  s += `<circle cx="${cx-r*0.34}" cy="${cy-r*0.14}" r="${r*0.09}" fill="#85340A"/>`;
  s += `<circle cx="${cx+r*0.34}" cy="${cy-r*0.14}" r="${r*0.09}" fill="#85340A"/>`;
  s += `<path d="M ${cx-r*0.36} ${cy+r*0.3} Q ${cx} ${cy+r*0.62} ${cx+r*0.36} ${cy+r*0.3}" stroke="#85340A" stroke-width="${r*0.11}" fill="none" stroke-linecap="round"/>`;
  return s;
}

function usaFlag(){
  let s = '';
  for(let i=0;i<13;i++) s += rect(0, i*H/13, W, H/13+0.4, i%2===0 ? '#B22234' : '#FFFFFF');
  const ch = H*7/13;                                 // canton = 7 stripes tall
  s += rect(0,0,124,ch,'#3C3B6E');
  for(let row=0;row<9;row++){
    const n  = row%2===0 ? 6 : 5;
    const x0 = row%2===0 ? 10.5 : 20.8;
    for(let i=0;i<n;i++) s += star(x0 + i*20.6, 6.4 + row*(ch-12.8)/8, 5.4, '#FFFFFF');
  }
  return s;
}

function brazilFlag(){
  let s = rect(0,0,W,H,'#009B3A');
  s += `<polygon points="150,17 283,100 150,183 17,100" fill="#FEDF00"/>`;
  s += `<circle cx="150" cy="100" r="52" fill="#002776"/>`;
  // banner with the motto, and the 27 stars in their coarse real constellations
  s += `<path d="M 100 111 A 118 118 0 0 1 200 89" stroke="#FFFFFF" stroke-width="11" fill="none"/>`;
  s += `<defs><path id="bzb__UID__" d="M 101 115.5 A 118 118 0 0 1 199 93.5"/></defs>`;
  s += `<text font-size="6" fill="#009B3A" font-weight="bold" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.4"><textPath href="#bzb__UID__" startOffset="8">ORDEM E PROGRESSO</textPath></text>`;
  const stars = [
    [168,76,1.8],                                                    // Spica, alone above the band
    [135,111,1.8],[127,121,1.8],[135,131,2],[143,119,1.5],[139,124,1],   // Southern Cross
    [172,104,2],[178,109,1.4],[183,115,1.4],[185,122,1.4],[183,129,1.4],[177,133,1.4],[170,131,1.4], // Scorpius
    [150,138,1.3],[156,133,1.3],[146,133,1.3],                       // Triangulum Australe
    [112,119,2],[118,124,1.4],[112,127,1.4],[106,123,1.4],[109,131,1.4], // Canis Major
    [128,138,2],[108,122,1.6],[150,144,1.5],[162,120,1.3],[167,126,1.3],[121,133,1.3],
  ];
  stars.forEach(p=>{ s += `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="#FFFFFF"/>`; });
  return s;
}

function spainFlag(){
  let s = hs(['#AA151B','#F1BF00','#AA151B'],[1,2,1]);
  const G='#F1BF00', R='#AD1519';
  // Pillars of Hercules, crowned, with the banner
  for(const px of [53,100]){
    s += `<ellipse cx="${px}" cy="120" rx="6" ry="2.5" fill="#B8B8B8"/>`;
    s += rect(px-3.5,86,7,33,'#CFCFCF');
    s += `<ellipse cx="${px}" cy="86" rx="5.5" ry="2.2" fill="#B8B8B8"/>`;
    s += rect(px-3,80,6,4,G) + `<circle cx="${px}" cy="78.5" r="2" fill="${R}"/>`;
    s += `<path d="M${px-7} 101 h14 v7 h-14 z" fill="${R}"/>`;
  }
  // quartered shield: Castile, Leon, Aragon, Navarre, Granada point, Bourbon oval
  s += `<path d="M62 78 h29 v30 c0 10 -7 14 -14.5 14 c-7.5 0 -14.5 -4 -14.5 -14 z" fill="#FFFFFF" stroke="${G}" stroke-width="1.5"/>`;
  s += rect(62,78,14.5,15,R) + rect(62,93,14.5,15,G);
  s += rect(76.5,93,14.5,15,R);
  s += rect(65.5,85,7.5,6,G) + rect(66.5,82,1.8,3,G) + rect(69.3,81,1.9,4,G) + rect(72.2,82,1.8,3,G); // castle
  s += `<path d="M80 91.5 q-0.5 -5 2.5 -7.5 q-0.5 -2 1.5 -2.5 q2 -0.5 2.5 1.5 q2.5 1 2 4.5 l-1 4.5 h-1.7 l-0.3 -2 -1.7 0 -0.3 2 z" fill="#7A2F8E"/>`; // rampant lion
  for(let i=0;i<4;i++) s += rect(63.8+i*3.3,93,1.7,15,R);                                             // Aragon pales
  s += `<circle cx="83.7" cy="100.5" r="1.2" fill="${G}"/>`;                                          // Navarre chains

  s += `<path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy} A ${r/2} ${r/2} 0 0 0 ${cx} ${cy} A ${r/2} ${r/2} 0 0 1 ${cx-r} ${cy} Z" fill="#CD2E3A"/>`;
  s += `</g>`;
  const bar = (y,broken)=> broken
    ? `<rect x="-21" y="${y}" width="18" height="8" fill="#000"/><rect x="3" y="${y}" width="18" height="8" fill="#000"/>`
    : `<rect x="-21" y="${y}" width="42" height="8" fill="#000"/>`;
  const trigram = (angle, pattern)=>{
    let g = `<g transform="rotate(${angle} ${cx} ${cy}) translate(${cx} ${cy})">`;

    return g + `</g>`;
  };
  s += trigram(-56.3, [0,0,0]);        // ☰ top-left
  s += trigram( 56.3, [1,0,1]);        // ☵ top-right
  s += trigram(-123.7, [0,1,0]);       // ☲ bottom-left
  s += trigram( 123.7, [1,1,1]);       // ☷ bottom-right
  return s;
}

function unionJack(w,h){                            // canton at 0,0 with counterchanged St Patrick's saltire
  let s = rect(0,0,w,h,'#00247D');
  s += `<path d="M0 0 L${w} ${h} M${w} 0 L0 ${h}" stroke="#FFFFFF" stroke-width="${(h*0.2).toFixed(1)}"/>`;
  const cx=w/2, cy=h/2, rw=(h*0.067).toFixed(1), o=h*0.045;
  [[0,0],[w,0],[0,h],[w,h]].forEach(c=>{
    const dx=c[0]-cx, dy=c[1]-cy, L=Math.hypot(dx,dy);
    const px=(dy/L)*o, py=(-dx/L)*o;                // counterclockwise side of each half-diagonal
    s += `<path d="M${(c[0]+px).toFixed(1)} ${(c[1]+py).toFixed(1)} L${(cx+px).toFixed(1)} ${(cy+py).toFixed(1)}" stroke="#CF142B" stroke-width="${rw}"/>`;
  });
  s += `<path d="M${cx} 0 V${h} M0 ${cy} H${w}" stroke="#FFFFFF" stroke-width="${(h*0.33).toFixed(1)}"/>`;
  s += `<path d="M${cx} 0 V${h} M0 ${cy} H${w}" stroke="#CF142B" stroke-width="${(h*0.2).toFixed(1)}"/>`;
  return s;
}

function crescent(ox,oy,orr, ix,iy,irr, fill){     // outer circle minus inner circle, as a path
  const d = Math.hypot(ix-ox, iy-oy);
  const a = (d*d + orr*orr - irr*irr) / (2*d);
  const h = Math.sqrt(Math.max(orr*orr - a*a, 0.01));
  const ux = (ix-ox)/d, uy = (iy-oy)/d;
  const mx = ox + a*ux, my = oy + a*uy;
  const p1 = [(mx - h*uy).toFixed(1), (my + h*ux).toFixed(1)];
  const p2 = [(mx + h*uy).toFixed(1), (my - h*ux).toFixed(1)];
  return `<path d="M ${p1} A ${orr} ${orr} 0 1 1 ${p2} A ${irr} ${irr} 0 1 0 ${p1} Z" fill="${fill}"/>`;
}

}

function kitSvg(spec){
  const {body, alt='#FFFFFF', pattern='plain'} = spec;
  const uid = ++svgUid;
  const torso = 'M105 62 q45 -20 90 0 l0 108 q-45 14 -90 0 z';
  let fillLayer = '';
  if(pattern==='stripes'){ for(let i=0;i<4;i++) fillLayer += `<rect x="${105+11.3+i*22.5}" y="40" width="11.3" height="136" fill="${alt}"/>`; }
  if(pattern==='hoops'){ for(let i=0;i<4;i++) fillLayer += `<rect x="100" y="${62+14+i*28}" width="100" height="14" fill="${alt}"/>`; }
  if(pattern==='half'){ fillLayer += `<rect x="150" y="40" width="50" height="140" fill="${alt}"/>`; }
  if(pattern==='sash'){ fillLayer += `<path d="M108 66 L192 168" stroke="${alt}" stroke-width="22"/>`; }
  if(pattern==='midstripe'){ fillLayer += `<rect x="139" y="40" width="22" height="140" fill="${alt}"/>`; }
  if(pattern==='checks'){ for(let r=0;r<8;r++) for(let c=0;c<7;c++) if((r+c)%2===0) fillLayer += `<rect x="${102+c*14}" y="${58+r*15}" width="14" height="15" fill="${alt}"/>`; }
  return `<svg viewBox="60 30 180 160" preserveAspectRatio="xMidYMid meet" role="img">
    <path d="M105 64 L62 84 L74 112 L105 96 Z" fill="${spec.sleeves||body}"/>
    <path d="M195 64 L238 84 L226 112 L195 96 Z" fill="${spec.sleeves||body}"/>
    <defs><clipPath id="kit${uid}"><path d="${torso}"/></clipPath></defs>
    <path d="${torso}" fill="${body}"/>
    <g clip-path="url(#kit${uid})">${fillLayer}</g>
    <path d="${torso}" fill="none" stroke="#202A5C" stroke-width="4"/>
    <path d="M105 64 L62 84 L74 112 L105 96 M195 64 L238 84 L226 112 L195 96" fill="none" stroke="#202A5C" stroke-width="4"/>
    <path d="M132 56 q18 10 36 0" fill="none" stroke="#202A5C" stroke-width="4"/>
  </svg>`;
}

/* ── seeded randomness, so the daily match is the same for everyone ──── */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1|seed);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14)>>>0)/4294967296;
  };
}
function dateSeed(ds){ let h=0; for(const c of ds){ h = Math.imul(31,h) + c.charCodeAt(0) | 0; } return h; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function yesterdayStr(from){
  const p = from ? String(from).split('-').map(Number) : null;
  const d = p ? new Date(p[0], p[1]-1, p[2]) : new Date();
  d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

/* ── saved progress (per player) ─────────────────────────────────────── */
function loadState(){
  try{
    const raw = JSON.parse(localStorage.getItem('flag-cup')||'{}');
    if(raw.players) return Object.assign({sound:true, current:PLAYER}, raw);
    // migrate the old single-player save shape
    return { sound: raw.sound!==false, current: PLAYER,
             players: {[PLAYER]: {best: raw.best||{}, mastery: raw.mastery||{}}} };
  }catch(e){ return {sound:true, current:PLAYER, players:{[PLAYER]:{best:{}, mastery:{}}}}; }
}
function saveState(){
  try{
    // merge with what's on disk first, so a second open tab never erases earned progress;
    // a corrupt stored blob must never block saving — parse defensively and overwrite it
    let disk = {};
    try{ disk = JSON.parse(localStorage.getItem('flag-cup')||'{}'); }catch(e){}
    if(!disk || typeof disk!=='object') disk = {};
    const diskPlayers = disk.players ||
      ((disk.best||disk.mastery) ? {[PLAYER]:{best:disk.best||{}, mastery:disk.mastery||{}}} : {});
    if(!disk.lv9) for(const name in diskPlayers) renameOldBonus(diskPlayers[name].best || {});
    for(const name in diskPlayers){
      const d = diskPlayers[name];
      const mine = hasOwn(state.players, name) ? state.players[name] : (state.players[name] = {best:{}, mastery:{}});
      for(const k in (d.best||{})){
        const db = d.best[k], mb = mine.best[k];
        if(!mb || db.stars>mb.stars || (db.stars===mb.stars && db.score>mb.score)) mine.best[k] = db;
      }
      // max-merge: two tabs answering the same flag at once may drop one mastery count — accepted
      for(const k in (d.mastery||{})) mine.mastery[k] = Math.max(mine.mastery[k]||0, d.mastery[k]);
      if(d.lightning && (d.lightning.best||0) > ((mine.lightning||{}).best||0))
        mine.lightning = Object.assign({}, mine.lightning, {best:d.lightning.best});
      if(d.miss){ mine.miss = mine.miss||{}; for(const k in d.miss) mine.miss[k] = Math.max(mine.miss[k]||0, d.miss[k]); }
      if(d.daily){
        // 'YYYY-M-D' is unpadded, so compare numerically, not as strings
        const dayNum = s=>{ const p=String(s||'').split('-').map(Number); return (p[0]||0)*10000+(p[1]||0)*100+(p[2]||0); };
        const md = mine.daily;
        if(!md || dayNum(d.daily.last) > dayNum(md.last))
          mine.daily = Object.assign({}, d.daily, {best: Math.max(d.daily.best||0, (md||{}).best||0)});
        else md.best = Math.max(md.best||0, d.daily.best||0);
      }
    }
    localStorage.setItem('flag-cup', JSON.stringify(state));
  }catch(e){}
}
let state = loadState();
const hasOwn = (obj,k)=> Object.prototype.hasOwnProperty.call(obj,k);   // never trust inherited keys ('constructor'…)
function renameOldBonus(best){      // pre-lv9 saves kept bonus stars at level 7; move them to 9
  for(const m of ['flags','find']){
    if(best[m+'-7']){ if(!best[m+'-9']) best[m+'-9'] = best[m+'-7']; delete best[m+'-7']; }
  }
}
(function migrateLevels(){          // the bonus level moved from 7 to 9 when the game grew to 9 levels
  if(state.lv9) return;
  for(const n in state.players) renameOldBonus((state.players[n]||{}).best || {});
  state.lv9 = true;
  saveState();
})();
if(PLAYER2 && !hasOwn(state.players, PLAYER2)) state.players[PLAYER2] = {best:{}, mastery:{}};
function P(){                                       // the current player's progress
  if(!hasOwn(state.players, state.current)) state.players[state.current] = {best:{}, mastery:{}};
  return state.players[state.current];
}

/* ── little sound engine ─────────────────────────────────────────────── */
let actx = null;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); return actx; }
function tone(freq, dur, type, at, vol, glideTo){
  const ctx = audio(); if(!ctx || !state.sound) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  const t0 = ctx.currentTime + (at||0);
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t0);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.16, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(ctx.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
const sfx = {
  tap:    ()=> tone(620, .06, 'square', 0, .05),
  correct:()=>{ tone(659, .12, 'triangle', 0, .18); tone(880, .22, 'triangle', .09, .18); },
  wrong:  ()=> tone(240, .3, 'sine', 0, .12, 170),
  pop:    ()=> tone(520, .1, 'triangle', 0, .2, 900),
  fanfare:()=>{
    [523,659,784,1047].forEach((f,i)=> tone(f, .18, 'triangle', i*0.13, .18));
    tone(1047, .5, 'triangle', .55, .2);
    const ctx = audio();
    if(ctx && state.sound){                                      // little crowd roar
      const len = ctx.sampleRate * 1.4, buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(Math.sin(Math.PI*i/len), 2);
      const src = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type='bandpass'; f.frequency.value=900; f.Q.value=0.6;
      g.gain.value = 0.10; src.buffer = buf;
      src.connect(f).connect(g).connect(ctx.destination); src.start();
    }
  },
};

/* ── read-aloud ──────────────────────────────────────────────────────── */
let voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function hushVoice(){
  if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }
}
function say(text){
  if(!state.sound || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(voice) u.voice = voice;
    u.rate = 0.92; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ── confetti ────────────────────────────────────────────────────────── */
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(big){
  if(reduceMotion) return;
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#FFC626','#FF6B6B','#2EA35B','#4AA8FF','#FFFFFF','#B07CFF'];
  const bits = Array.from({length: big?160:80}, ()=>({
    x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*0.5,
    w: 7+Math.random()*7, h: 10+Math.random()*8,
    c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2.3+Math.random()*3.2, vx: -1.4+Math.random()*2.8,
    r: Math.random()*Math.PI, vr: -0.14+Math.random()*0.28,
  }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    bits.forEach(b=>{
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore();
    });
    if(t - t0 < (big?3400:2200)) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

}

function starRowSmall(n){
  let s = '<span style="display:inline-flex;gap:2px">';
  for(let i=0;i<3;i++) s += `<span style="width:22px;height:22px;display:inline-block">${starSvg(i<n?'#FFC626':'#E4E8F4')}</span>`;
  return s+'</span>';
}

/* ── building a match ────────────────────────────────────────────────── */
function pickDistractors(flag, pool, n, rnd){
  rnd = rnd || Math.random;
  const confus = (CONFUSABLE[flag.id]||[]).map(id=>flagById[id]).filter(Boolean);
  // sneaky lookalikes get guaranteed slots; the rest fill up from the level pool
  const sneaky = shuffle(confus, rnd).slice(0, Math.min(confus.length, rnd()<0.7?1:2, n));
  const rest = shuffle(pool.filter(f=>f.id!==flag.id && !sneaky.includes(f)), rnd);
  return shuffle(sneaky.concat(rest.slice(0, Math.max(0, n - sneaky.length))), rnd);
}
function capDistractors(flag, pool, n, rnd){
  // no two answer buttons may show the same capital (gb and gb-eng both say 'London')
  const seen = new Set([CAPITALS[flag.id]]), ds = [];
  for(const f of shuffle(pool.filter(x=>x.id!==flag.id), rnd)){
    if(seen.has(CAPITALS[f.id])) continue;
    seen.add(CAPITALS[f.id]); ds.push(f);
    if(ds.length===n) break;
  }
  return ds;
}
function buildMatch(mode, level){
  if(mode==='wc'){
    const bank = level===1 ? WC_ROOKIE : level===2 ? WC_LEGEND : level===3 ? WC_STARS : level===4 ? WC_CLUBS : level===5 ? WC_TROPHY : WC_KITS;
    return shuffle(bank).slice(0,10).map(item=>{
      const opts = shuffle([item.a].concat(item.wrong));
      return {kind:'wc', prompt:item.q, options:opts, answer:opts.indexOf(item.a), fact:item.fact, flags:item.flags||null, kit:item.kit||null};
    });
  }
  const old = level===9;                             // bonus level: flags of former countries
  if(mode==='caps'){
    const pool = FLAGS.filter(f=>f.level===level && CAPITALS[f.id] && !NO_CAP_QUIZ.has(f.id));
    const nOpts = level===1 ? 3 : 4;
    return shuffle(pool).slice(0,10).map(flag=>{
      const ds = capDistractors(flag, pool, nOpts-1);
      const opts = shuffle([flag].concat(ds));
      return {
        kind:'caps', flag, options:opts, answer:opts.indexOf(flag),
        prompt: (old ? 'Long ago, what was the capital of ' : 'What is the capital of ') + flag.name + '?',
        fact: old ? `${CAPITALS[flag.id]} was ${flag.name}’s capital city.` : `${CAPITALS[flag.id]} is ${flag.name}’s capital city.`,
      };
    });
  }
  const pool = FLAGS.filter(f=>f.level===level);
  const nOpts = (mode==='flags' && level===1) ? 3 : 4;
  // spaced repetition: flags this player has missed sneak back in sooner
  const missMap = P().miss || {};
  const missed = shuffle(pool.filter(f=>missMap[f.id]>0)).slice(0,4);
  const rest = shuffle(pool.filter(f=>!missed.includes(f)));
  return shuffle(missed.concat(rest).slice(0,10)).map(flag=>{
    const ds = pickDistractors(flag, pool, nOpts-1);
    const opts = shuffle([flag].concat(ds));
    return {
      kind: mode,        // 'flags': see flag, pick name — 'find': hear name, pick flag
      flag, options:opts, answer:opts.indexOf(flag),
      prompt: mode==='flags'
        ? (old ? 'Long ago, whose flag was this?' : 'Which country’s flag is this?')
        : (old ? `Tap the old flag of ${flag.name}!` : `Tap the flag of ${flag.name}!`),
      fact: flag.fact,
    };
  });
}

/* ── playing a match ─────────────────────────────────────────────────── */
let match = null, advanceTimer = null;
function startMatch(mode, level){
  clearTimeout(advanceTimer);
  match = {mode, level, qs: buildMatch(mode, level), i:0, firstTry:0, laterTry:0, tries:0, done:[]};
  renderQuestion();
}
function renderQuestion(){
  const q = match.qs[match.i];
  match.tries = 0;
  match.renderedAt = performance.now();   // grace period against tap-through from the previous screen
  const dots = match.qs.map((_,i)=>{
    const cls = i===match.i ? 'now' : (match.done[i]==='hit' ? 'hit' : match.done[i]==='ok' ? 'ok' : '');
    return `<span class="dot ${cls}"></span>`;
  }).join('');
  let card = '', answers = '';
  if(q.kind==='find'){
    answers = `<div class="answers flagrid">` + q.options.map((f,i)=>
      `<button class="ans-btn flagopt" data-ans="${i}" aria-label="${esc(f.name)} flag choice">
         <span class="optflag ${f.square?'sq':''}">${wrap(f.svg)}</span></button>`).join('') + `</div>`;
  } else if(q.kind==='flags'){
    answers = `<div class="answers">` + q.options.map((f,i)=>
      `<button class="ans-btn" data-ans="${i}">${esc(f.name)}</button>`).join('') + `</div>`;
  } else if(q.kind==='caps'){
    answers = `<div class="answers">` + q.options.map((f,i)=>
      `<button class="ans-btn" data-ans="${i}">${esc(CAPITALS[f.id])}</button>`).join('') + `</div>`;
  } else {
    answers = `<div class="answers">` + q.options.map((t,i)=>{
      const ff = q.flags && q.flags[t] ? flagById[q.flags[t]] : null;
      const mini = ff ? `<span class="optflag ${ff.square?'sq':''}">${wrap(ff.svg)}</span>` : '';
      return `<button class="ans-btn" data-ans="${i}">${mini}${esc(t)}</button>`;
    }).join('') + `</div>`;
  }
  if(q.kind==='flags' || q.kind==='caps'){
    card = `<div class="bigflag ${q.flag.square?'sq':''}">${wrap(q.flag.svg)}</div>`;
  } else if(q.kit){
    card = `<div class="bigflag" style="background:transparent;border-color:transparent;box-shadow:none">${kitSvg(q.kit)}</div>`;
  }
  const homeModes = {daily:1, duel:1};
  const scoreboard = match.duel
    ? `<span class="ballcount">${esc(match.players[0].slice(0,8))} ${match.scores[0]} – ${match.scores[1]} ${esc(match.players[1].slice(0,8))}</span>`
    : `<span class="ballcount">⚽ ${match.firstTry}</span>`;
  const turn = match.duel
    ? `<div class="turnbanner">${match.shootout?'🥅 PENALTIES! ':''}⚽ ${esc(match.players[match.i % 2])}’s ball!</div><br>`
    : '';
  stage.innerHTML = `
    <div class="quizbar">
      <button class="back-btn" ${homeModes[match.mode]?'data-go="home"':`data-go="levels" data-mode="${match.mode}"`} aria-label="Quit match">✕</button>
      <div class="dots">${dots}</div>
      ${scoreboard}
    </div>
    <div class="qcard">
      <button class="say-btn" data-act="say" aria-label="Read aloud">🔊</button>
      ${turn}
      <p class="qprompt">${esc(q.prompt)}</p>
      ${card}
    </div>
    ${answers}
    <div id="fb"></div>`;
  wire();
  if(q.kind==='find') say(match.duel ? `${match.players[match.i % 2]}: ${q.prompt}` : q.prompt);
  else if(match.duel) say(`${match.players[match.i % 2]}’s ball!`);
}
function sayCurrent(){
  const q = match && match.qs[match.i];
  if(!q) return;
  if(q.kind==='flags') say(q.prompt);
  else if(q.kind==='find') say(q.prompt);
  else if(q.kind==='caps') say(q.prompt + '. ' + q.options.map(f=>CAPITALS[f.id]).join('. Or, '));
  else say(q.prompt + '. ' + q.options.join('. Or, '));
}
function playerProg(name){
  if(!hasOwn(state.players, name)) state.players[name] = {best:{}, mastery:{}};
  return state.players[name];
}
function answer(i, btn){
  if(!match || performance.now() - (match.renderedAt||0) < 350) return;  // ignore taps meant for the previous screen
  const q = match.qs[match.i];
  match.tries++;
  const prog = match.duel ? playerProg(match.players[match.i % 2]) : P();
  const flagKind = q.kind==='flags' || q.kind==='find';
  if(i===q.answer){
    const first = match.tries===1;
    if(first){ match.firstTry++; match.done[match.i]='hit'; }
    else { match.laterTry++; match.done[match.i]='ok'; }
    if(match.duel && first) match.scores[match.i % 2]++;
    if(q.flag && first && flagKind){
      prog.mastery[q.flag.id] = (prog.mastery[q.flag.id]||0)+1;
      if(prog.miss && prog.miss[q.flag.id]){                // it came back and they got it — ease off
        prog.miss[q.flag.id]--;
        if(!prog.miss[q.flag.id]) delete prog.miss[q.flag.id];
      }
      saveState();
    }
    sfx.correct();
    btn.classList.add('right');
    document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);
    const name = q.kind==='caps' ? CAPITALS[q.flag.id] : (q.flag ? q.flag.name : q.options[q.answer]);
    const cheers = ['Goal!','Brilliant!','Super save!','What a shot!','Top corner!','You’re on fire!'];
    const cheer = first ? cheers[Math.floor(Math.random()*cheers.length)] : 'You got it!';
    document.getElementById('fb').innerHTML =
      `<div class="feedback yay">${cheer} ${q.kind!=='wc' ? 'It’s '+esc(name)+'!' : ''}
       <span class="fact">${esc(q.fact||'')}</span></div>`;
    if((q.kind==='flags' || q.kind==='caps') && first) say(cheer + ' ' + name + '!');
    const wait = q.kind==='wc' ? 2600 : 1800;
    advanceTimer = setTimeout(nextQuestion, wait);
  } else {
    if(match.tries===1 && q.flag && flagKind){             // remember the miss — this flag will come back
      const m = prog.miss || (prog.miss = {});
      m[q.flag.id] = (m[q.flag.id]||0)+1;
      saveState();
    }
    sfx.wrong();
    btn.classList.add('nope');
    btn.disabled = true;
    const nudges = ['Good try! Have another go!','Almost! Try again!','So close! One more try!'];
    document.getElementById('fb').innerHTML =
      `<div class="feedback try">${nudges[Math.floor(Math.random()*nudges.length)]}</div>`;
  }
}
function nextQuestion(){
  if(!match) return;
  match.i++;
  if(match.i < match.qs.length) renderQuestion();
  else if(match.duel && match.scores[0]===match.scores[1] && match.qs.length < 16){
    match.qs = match.qs.concat(buildMixedQs(2));           // penalties: one question each
    match.shootout = true;
    renderQuestion();
  }
  else finishMatch();
}
function finishMatch(){
  if(match.duel) return finishDuel();
  if(match.mode==='daily') return finishDaily();
  const score = match.firstTry, n = match.qs.length;
  const stars = score>=9 ? 3 : score>=7 ? 2 : score>=5 ? 1 : 0;
  const key = match.mode+'-'+match.level;
  const prev = bestFor(key);
  if(stars>prev.stars || (stars===prev.stars && score>prev.score)){
    P().best[key] = {stars, score};
    saveState();
  }
  const who = state.current;
  const cheer =
    stars===3 && score===n ? `PERFECT, ${who}! Ten out of ten — what a superstar!` :
    stars===3 ? `INCREDIBLE, ${who}! What a superstar — you’re a world champion!` :
    stars===2 ? `Amazing work, ${who}! One more star to go — you can do it!` :
    stars===1 ? `Great match, ${who}! Keep playing and grab more stars!` :
                `Good practice, ${who}! Every champion starts somewhere. Try again!`;
  const nextLevel = match.level + 1;
  const maxLevel = match.mode==='wc' ? 6 : 9;
  stage.innerHTML = `
    <div class="card results">
      <h2>${stars>=2?'⚽ FULL TIME! ⚽':'Full time!'}</h2>
      ${starRow(stars, 64, true)}
      <p class="scoreline">You scored ${score} out of ${n}!</p>
      <p class="cheer">${esc(cheer)}</p>
      <div class="btnrow">
        ${nextLevel<=maxLevel ? `<button class="go-btn" data-play="${match.mode}" data-level="${nextLevel}">Next level ▶</button>` : ''}
        <button class="go-btn ${nextLevel<=maxLevel?'quiet':''}" data-play="${match.mode}" data-level="${match.level}">Play again ↻</button>
        <button class="go-btn quiet" data-go="home">Home 🏠</button>
      </div>
    </div>`;
  wire();
  sfx.fanfare();
  confetti(stars>=3);
  say(cheer);
}

/* ── mixed-question builder (daily + duel + penalties) ───────────────── */
function buildMixedQs(n, rng){
  rng = rng || Math.random;
  const modern = FLAGS.filter(f=>f.level<9);
  const capsOk = f => CAPITALS[f.id] && !NO_CAP_QUIZ.has(f.id);
  const mk = (flag, kind) => {
    const pool = FLAGS.filter(f=>f.level===flag.level);
    const ds = kind==='caps'
      ? capDistractors(flag, pool.filter(capsOk), 3, rng)
      : pickDistractors(flag, pool, 3, rng);
    const opts = shuffle([flag].concat(ds), rng);
    return {kind, flag, options:opts, answer:opts.indexOf(flag),
      prompt: kind==='flags' ? 'Which country’s flag is this?'
            : kind==='find' ? `Tap the flag of ${flag.name}!`
            : `What is the capital of ${flag.name}?`,
      fact: kind==='caps' ? `${CAPITALS[flag.id]} is ${flag.name}’s capital city.` : flag.fact};
  };
  const kinds = [];
  for(let i=0;i<n;i++) kinds.push(['flags','find','caps','wc'][i % 4]);
  const picks = shuffle(modern, rng);
  const capPicks = shuffle(modern.filter(capsOk), rng);
  const bank = shuffle(WC_ROOKIE.concat(WC_LEGEND, WC_STARS, WC_CLUBS, WC_TROPHY, WC_KITS), rng);
  let pi=0, ci=0, bi=0;
  const qs = kinds.map(kind=>{
    if(kind==='wc'){
      const item = bank[bi++ % bank.length];
      const opts = shuffle([item.a].concat(item.wrong), rng);
      return {kind:'wc', prompt:item.q, options:opts, answer:opts.indexOf(item.a), fact:item.fact, flags:item.flags||null, kit:item.kit||null};
    }
    return mk(kind==='caps' ? capPicks[ci++] : picks[pi++], kind);
  });
  return shuffle(qs, rng);
}

/* ── Match of the Day ────────────────────────────────────────────────── */
function startDaily(){
  clearTimeout(advanceTimer);
  const day = todayStr();          // credit the run to the day whose quiz was dealt, even across midnight
  const rng = mulberry32(dateSeed(day));
  match = {mode:'daily', day, qs: buildMixedQs(10, rng), i:0, firstTry:0, laterTry:0, tries:0, done:[]};
  renderQuestion();
}
function finishDaily(){
  const score = match.firstTry, n = match.qs.length;
  const d = P().daily || (P().daily = {});
  const today = match.day || todayStr();
  const firstToday = d.last !== today;
  if(firstToday){
    d.streak = (d.last === yesterdayStr(today)) ? (d.streak||0)+1 : 1;
    d.best = Math.max(d.best||0, d.streak);
    d.last = today;
    saveState();
  }
  const cheer = firstToday
    ? `🔥 ${d.streak} day streak, ${state.current}! Come back tomorrow to keep the fire burning!`
    : `Streak already safe today — that was just for fun, ${state.current}!`;
  stage.innerHTML = `
    <div class="card results">
      <h2>📅 FULL TIME!</h2>
      <p class="scoreline">Today’s score: ${score} out of ${n}!</p>
      <div class="starrow"><span style="font-size:56px">🔥</span></div>
      <p class="scoreline">${d.streak||0} day streak &nbsp;·&nbsp; best ever: ${d.best||0}</p>
      <p class="cheer">${esc(cheer)}</p>
      <div class="btnrow">
        <button class="go-btn quiet" data-go="home">Home 🏠</button>
      </div>
    </div>`;
  wire();
  sfx.fanfare(); confetti(score>=8); say(cheer);
}

/* ── Lightning round ─────────────────────────────────────────────────── */
let lightning = null, lightningTimer = null;
function stopLightning(){ clearInterval(lightningTimer); lightningTimer = null; lightning = null; }
function goLightning(){
  const best = (P().lightning||{}).best || 0;
  stage.innerHTML = `
    <div class="topbar">
      <button class="back-btn" data-go="home" aria-label="Back">←</button>
      <h1 class="screen-title">Lightning ⚡</h1>
    </div>
    <div class="card results">
      <h2>60 seconds!</h2>
      <p class="cheer">How many flags can you name before the whistle? No pressure — just fun and fast!</p>
      ${best ? `<p class="scoreline">Your best: ⚡ ${best}</p>` : ''}
      <div class="btnrow"><button class="go-btn" data-act="golightning">GO! ⚡</button></div>
    </div>`;
  wire();
}
function startLightning(){
  lightning = {score:0, end: Date.now()+60000};
  lightningTimer = setInterval(()=>{
    const left = lightning ? lightning.end - Date.now() : 0;
    const bar = document.getElementById('lbar');
    if(bar) bar.style.width = Math.max(0, left/600) + '%';
    if(left <= 0) finishLightning();
  }, 100);
  nextLightningQ();
}
function nextLightningQ(){
  if(!lightning) return;
  const pool = FLAGS.filter(f=>f.level<9);
  const flag = pool[Math.floor(Math.random()*pool.length)];
  const ds = shuffle(FLAGS.filter(f=>f.level===flag.level && f.id!==flag.id)).slice(0,2);
  lightning.q = {flag, options: shuffle([flag].concat(ds))};
  lightning.renderedAt = performance.now();          // tap-through guard, same as answer()
  stage.innerHTML = `
    <div class="quizbar">
      <button class="back-btn" data-go="home" aria-label="Quit">✕</button>
      <span class="ballcount" style="flex:1;text-align:center">⚡ ${lightning.score}</span>
    </div>
    <div class="timerbar"><div id="lbar" style="width:${Math.max(0,(lightning.end-Date.now())/600)}%"></div></div>
    <div class="qcard">
      <div class="bigflag ${lightning.q.flag.square?'sq':''}">${wrap(lightning.q.flag.svg)}</div>
    </div>
    <div class="answers">
      ${lightning.q.options.map((f,i)=>`<button class="ans-btn" data-lans="${i}">${esc(f.name)}</button>`).join('')}
    </div>`;
  wire();
}
function answerLightning(i, btn){
  if(!lightning) return;
  if(performance.now() - (lightning.renderedAt||0) < 350) return;
  if(lightning.q.options[i] === lightning.q.flag){
    lightning.score++; sfx.pop(); nextLightningQ();
  } else {
    sfx.wrong(); btn.classList.add('nope'); btn.disabled = true;
    setTimeout(()=>{ if(lightning) nextLightningQ(); }, 550);
  }
}
function finishLightning(){
  const score = lightning ? lightning.score : 0;
  stopLightning();
  const lp = P().lightning || (P().lightning = {});
  const isBest = score > (lp.best||0);
  if(isBest){ lp.best = score; saveState(); }
  stage.innerHTML = `
    <div class="card results">
      <h2>⚡ FULL TIME! ⚡</h2>
      <p class="scoreline">You named ${score} ${score===1?'flag':'flags'} in 60 seconds!</p>
      <p class="cheer">${isBest ? 'NEW BEST SCORE! ⚡🎉' : `Your best is ${lp.best||score}. You’ll beat it!`}</p>
      <div class="btnrow">
        <button class="go-btn" data-act="golightning">Again! ⚡</button>
        <button class="go-btn quiet" data-go="home">Home 🏠</button>
      </div>
    </div>`;
  wire();
  sfx.fanfare(); if(isBest) confetti(true);
}

      <div class="trophyrow"><span style="font-size:30px">⚡</span><span class="tname">Lightning best</span>
        <span class="tstars">${(P().lightning||{}).best||0} ${((P().lightning||{}).best||0)===1?'flag':'flags'}</span></div>
      <button class="go-btn ${total>=50?'':'quiet'}" data-act="cert" data-tier="explorer" ${total>=50?'':'disabled'}>
        ${total>=50 ? '📜 Flag Explorer certificate!' : `📜 Flag Explorer at 50 ⭐ (you have ${total})`}</button>
      <button class="go-btn ${total>=MAX_STARS?'':'quiet'}" data-act="cert" data-tier="champion" ${total>=MAX_STARS?'':'disabled'}>
        ${total>=MAX_STARS ? '🏆 WORLD CHAMPION certificate!' : `🏆 World Champion at ${MAX_STARS} ⭐`}</button>
    </div>`;
  wire();
}
function certHtml(tier){
  const today = new Date().toLocaleDateString(undefined, {day:'numeric', month:'long', year:'numeric'});
  return `<div class="certcard">
    <div style="font-size:44px">${tier==='champion'?'🏆':'📜'}</div>
    <h2>CERTIFICATE</h2>
    <p>This is to declare that</p>
    <div class="cname">${esc(state.current)}</div>
    <p>is an official <b>${tier==='champion'?'WORLD CHAMPION':'FLAG EXPLORER'}</b> of the Flag Cup</p>
    <p>⭐ ${totalStars()} stars · 210 flags of the world</p>
    <p>${today}</p>
  </div>`;
}
function showCert(tier){
  const div = document.createElement('div');
  div.className = 'peek';
  div.innerHTML = `<div class="card" style="padding:14px">${certHtml(tier)}
    <div class="btnrow" style="margin-top:12px">
      <button class="go-btn" data-act="printcert" data-tier="${tier}">Print it! 🖨️</button>
      <button class="go-btn quiet" data-act="peekclose">Close ✕</button>
    </div></div>`;
  div.addEventListener('click', e=>{
    if(e.target===div || e.target.closest('[data-act="peekclose"]')) div.remove();
    else if(e.target.closest('[data-act="printcert"]')) printNode(certHtml(tier));
  });
  document.body.appendChild(div);
  sfx.fanfare(); confetti(true);
}
let printCleanup = null;                 // clear leftovers if afterprint never fired (iOS Safari)
function printNode(innerHtml){
  if(printCleanup) printCleanup();
  const div = document.createElement('div');
  div.id = 'printzone';
  div.innerHTML = innerHtml;
  document.querySelectorAll('#printzone').forEach(el=>el.remove());
  document.body.appendChild(div);
  document.body.classList.add('printing');
  let fallback;
  const done = ()=>{ div.remove(); document.body.classList.remove('printing');
    window.removeEventListener('afterprint', done); clearTimeout(fallback);
    if(printCleanup===done) printCleanup = null; };
  printCleanup = done;
  window.addEventListener('afterprint', done);
  setTimeout(()=>{ try{ window.print(); }catch(e){ done(); } }, 60);
  fallback = setTimeout(done, 120000);
}
function printPoster(){
  printNode(`<h1>The Flag Cup — All 210 Flags</h1>` + LEVELS.map(l=>
    `<h2>${l.bonus?'BONUS: ':''}${l.name}</h2><div class="printgrid">` +
    FLAGS.filter(f=>f.level===l.n).map(f=>
      `<div class="pf"><div class="pfl">${wrap(f.svg)}</div><div class="pfn">${esc(f.name)}</div></div>`).join('') +
    `</div>`).join(''));
}

/* ── flag book ───────────────────────────────────────────────────────── */
function goBook(){
  stage.innerHTML = `
    <div class="topbar">
      <button class="back-btn" data-go="home" aria-label="Back">←</button>
      <h1 class="screen-title">Flag Book</h1>
      <span class="pill" style="margin-left:auto"><button data-act="poster">🖨️ Poster</button></span>
    </div>
    ${LEVELS.map(l=>`
      <h2 class="booksec">${l.icon} ${l.bonus ? 'BONUS: '+l.name : l.name}</h2>
      <div class="bookgrid">
        ${FLAGS.filter(f=>f.level===l.n).map(f=>{
          const m = P().mastery[f.id]||0;
          const medal = m>=3 ? '🌟' : m>=1 ? '⭐' : '';
          return `<button class="sticker" data-peek="${f.id}">
            ${medal?`<span class="medal">${medal}</span>`:''}
            <span class="flg ${f.square?'sq':''}">${wrap(f.svg)}</span>
            <span class="nm">${esc(f.name)}</span>
          </button>`;
        }).join('')}
      </div>`).join('')}
    <p style="text-align:center; color:#EAFFF2; font-weight:700; margin-top:20px; text-shadow:0 2px 0 rgba(18,58,35,.35)">
      ⭐ = answered right &nbsp; 🌟 = flag master!</p>`;
  wire();
}
function peekFlag(id){
  const f = flagById[id];
  const m = P().mastery[id]||0;
  const div = document.createElement('div');
  div.className = 'peek';
  div.innerHTML = `
    <div class="card">
      <div class="bigflag ${f.square?'sq':''}" style="margin:0 auto">${wrap(f.svg)}</div>
      <h3>${esc(f.name)}</h3>
      ${CAPITALS[f.id] ? `<p class="learn" style="color:var(--ink-soft)">🏛️ Capital: ${esc(CAPITALS[f.id])}</p>` : ''}
      ${m>0?`<p class="learn">${m>=3?'🌟 Flag master!':'⭐ You know this one!'}</p>`:''}
      <p class="fact">${esc(f.fact)}</p>
      <div class="btnrow">
        <button class="go-btn" data-act="peeksay">Hear it 🔊</button>
        <button class="go-btn quiet" data-act="peekclose">Close ✕</button>
      </div>
    </div>`;
  div.addEventListener('click', e=>{
    if(e.target===div || e.target.closest('[data-act="peekclose"]')) div.remove();
    else if(e.target.closest('[data-act="peeksay"]')){ sfx.tap(); say(f.name + (CAPITALS[f.id] ? '. Capital: ' + CAPITALS[f.id] : '') + '. ' + f.fact); }
  });
  document.body.appendChild(div);
  say(f.name);
}

/* ── event wiring ────────────────────────────────────────────────────── */
function wire(){
  stage.querySelectorAll('[data-go]').forEach(b=> b.addEventListener('click', ()=>{
    sfx.tap();
    match = null; clearTimeout(advanceTimer);   // leaving a match cancels its pending advance
    stopLightning();
    hushVoice();
    const go = b.dataset.go;
    if(go==='home') goHome();
    else if(go==='book') goBook();
    else if(go==='levels') goLevels(b.dataset.mode);
    else if(go==='daily') startDaily();
    else if(go==='duel') goDuelSetup();
    else if(go==='lightning') goLightning();
    else if(go==='trophies') goTrophies();
  }));
  stage.querySelectorAll('[data-duelpick]').forEach(b=> b.addEventListener('click', ()=>{
    sfx.tap();
    duelPick.push(b.dataset.duelpick);
    if(duelPick.length===2) startDuel(); else renderDuelPick();
  }));
  stage.querySelectorAll('[data-act="rematch"]').forEach(b=> b.addEventListener('click', ()=>{ sfx.tap(); startDuel(); }));
  stage.querySelectorAll('[data-act="golightning"]').forEach(b=> b.addEventListener('click', ()=>{ sfx.tap(); startLightning(); }));
  stage.querySelectorAll('[data-lans]').forEach(b=> b.addEventListener('click', ()=> answerLightning(parseInt(b.dataset.lans,10), b)));
  stage.querySelectorAll('[data-act="cert"]').forEach(b=> b.addEventListener('click', ()=>{ if(!b.disabled){ sfx.tap(); showCert(b.dataset.tier); } }));
  stage.querySelectorAll('[data-act="poster"]').forEach(b=> b.addEventListener('click', ()=>{ sfx.tap(); printPoster(); }));
  stage.querySelectorAll('[data-play]').forEach(b=> b.addEventListener('click', ()=>{
    sfx.tap(); hushVoice(); startMatch(b.dataset.play, parseInt(b.dataset.level,10));
  }));
  stage.querySelectorAll('[data-ans]').forEach(b=> b.addEventListener('click', ()=> answer(parseInt(b.dataset.ans,10), b)));
  stage.querySelectorAll('[data-act="say"]').forEach(b=> b.addEventListener('click', ()=>{ sfx.tap(); sayCurrent(); }));
  stage.querySelectorAll('[data-act="sound"]').forEach(b=> b.addEventListener('click', ()=>{
    state.sound = !state.sound; saveState();
    if(!state.sound && 'speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }
    goHome();
  }));
  stage.querySelectorAll('[data-peek]').forEach(b=> b.addEventListener('click', ()=>{ sfx.tap(); peekFlag(b.dataset.peek); }));
  stage.querySelectorAll('[data-player]').forEach(b=> b.addEventListener('click', ()=>{
    sfx.tap(); state.current = b.dataset.player; saveState(); goHome();
  }));
  stage.querySelectorAll('[data-act="players"]').forEach(b=> b.addEventListener('click', ()=>{ sfx.tap(); goPlayers(); }));
  stage.querySelectorAll('[data-act="newplayer"]').forEach(b=> b.addEventListener('click', ()=>{ sfx.tap(); goNewPlayer(); }));
  stage.querySelectorAll('[data-act="saveplayer"]').forEach(b=> b.addEventListener('click', ()=>{ sfx.tap(); savePlayer(); }));
}

document.addEventListener('pointerdown', ()=>audio(), {once:true});
window.__game = {startMatch, goHome, goBook, goPlayers, savePlayer, FLAGS, CONFUSABLE, CAPITALS, NO_CAP_QUIZ,
  state:()=>state, match:()=>match, answer, buildMatch, P, buildMixedQs, startDaily, goDuelSetup, startDuel,
  goLightning, startLightning, goTrophies, lightning:()=>lightning, duelPickList:()=>duelPick, setDuelPick:(a)=>{duelPick=a;}};

const params = new URLSearchParams(location.search);
if(params.has('book')) goBook();
else goHome();
</script>
